<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>抠图 — KK工作台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="backlink" href="index.html">← 工作台</a>
  <div class="brand"><span class="logo">K</span> KK工作台 <span class="ver">v0.3</span></div>
  <span class="pagetitle">抠图(透明底)</span>
</header>

<main class="page-main">
  <aside id="left">
    <section>
      <h3>上传图片</h3>
      <div class="row">
        <button id="cutBtn" class="btn wide">选择图片(或拖入右侧)</button>
        <input type="file" id="cutInput" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
      <div id="cutInfo" class="hint">支持 JPG/PNG/WebP。</div>
    </section>

    <section>
      <h3>版本</h3>
      <div class="row">
        <label>版本
          <select id="matModel">
            <option value="ben2">Ben2</option>
            <option value="briaai">Briaii</option>
            <option value="inspyrenet">InSPyReNet</option>
            <option value="u2net">U2net</option>
            <option value="isnet-anime">Isnet-anime</option>
          </select>
        </label>
      </div>
      <div id="modelDesc" class="hint"></div>
    </section>

    <section>
      <h3>贴边剪裁</h3>
      <div class="row">
        <label class="switch-row"><input id="trimToggle" type="checkbox"> 输出时裁掉透明边</label>
      </div>
      <button id="runBtn" class="btn primary wide">✨ 开始处理</button>
      <div class="hint">全自动 AI 抠图,复杂背景也适用;换版本后重新「开始处理」即可对比效果。</div>
    </section>

    <section>
      <h3>修边</h3>
      <div class="row">
        <label>画笔
          <select id="brushMode">
            <option value="erase">擦除</option>
            <option value="restore">恢复(从原图)</option>
            <option value="wand">魔棒(点同色区域)</option>
          </select>
        </label>
      </div>
      <div class="row"><label>半径 <span id="brushRVal">20</span></label><input id="brushR" type="range" min="4" max="90" step="1" value="20"></div>
      <div class="row"><label>魔棒容差 <span id="wandTolVal">0.15</span></label><input id="wandTol" type="range" min="0.02" max="0.5" step="0.01" value="0.15"></div>
      <div class="row">
        <button id="undoStroke" class="btn">撤销一步</button>
        <button id="clearStrokes" class="btn">清空修边</button>
      </div>
      <div class="hint">撤销/清空会按记录重放(换版本重抠后仍然正确)。</div>
    </section>

    <section>
      <h3>下载</h3>
      <div class="row">
        <button id="dlPng" class="btn primary wide" disabled>下载透明 PNG</button>
      </div>
      <div class="row">
        <button id="dlWebp" class="btn wide" disabled>下载 WebP(透明)</button>
      </div>
      <div class="hint">透明 PNG 可直接用于引擎或网页;需要更小体积可去工作台的「图片压缩」。</div>
    </section>
  </aside>

  <div id="center">
    <canvas id="view" width="860" height="560"></canvas>
  </div>
</main>

<footer class="statusbar"><span id="status">上传图片,选版本后点「开始处理」;出图后画笔/魔棒修边。</span></footer>

<!-- 页内门禁兜底:绕过首页直开本页也需邀请码;与生图/生视频同一把码,验证过则静默直进 -->
<div class="gate-overlay" id="gateOverlay">
  <div class="gate-dialog" role="dialog" aria-modal="true">
    <h2>抠图</h2>
    <p class="hint">内部工作台,请输入邀请码进入;一天内错误 3 次将锁定到明天。</p>
    <input type="password" class="gate-input" id="gateCode" autocomplete="off" placeholder="邀请码">
    <button class="btn primary wide" id="gateGo">进入</button>
    <p class="gate-error" id="gateError" hidden></p>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/gate.js"></script>
<script src="js/cutout.js"></script>
<script src="js/duoli_video.js"></script>
<script src="js/duoli.js"></script>
</body>
</html>
