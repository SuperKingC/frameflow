<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图片压缩 — KK工作台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="backlink" href="index.html">← 工作台</a>
  <div class="brand"><span class="logo">K</span> KK工作台 <span class="ver">v0.3</span></div>
  <span class="pagetitle">图片压缩</span>
</header>

<main class="czip-main">
  <div class="czip-grid">
    <div class="czip-panel">
      <h3>上传</h3>
      <div class="dropzone" id="dropzone">
        <div style="font-size:15px;margin-bottom:4px">拖图片到这里,或点击选择</div>
        <div style="font-size:11px;color:var(--text-3)">PNG / JPEG / WebP · TinyPNG 在线压缩(经本机服务器代理)</div>
      </div>
      <input type="file" id="czipInput" accept="image/png,image/jpeg,image/webp" hidden>

      <h3 style="margin-top:18px">压缩</h3>
      <div class="row">
        <button id="btnTinypng" class="btn primary wide">TinyPNG 在线压缩</button>
      </div>
      <div class="hint">智能压缩,视觉无差;走本机服务器代理,key 只在服务端环境/.env,不进浏览器。免费额度 500 张/月。</div>
    </div>

    <div class="czip-stage">
      <div class="czip-empty" id="czipEmpty">
        <div style="font-size:26px">🗜️</div>
        <div>拖入一张图,这里出现 原图 vs 压缩结果 的对比</div>
      </div>
      <div class="compare" id="czipCompare" hidden>
        <div class="cell">
          <h4>原图 <span class="size" id="origSize"></span></h4>
          <div class="pvwrap"><canvas id="pvOrig"></canvas></div>
        </div>
        <div class="cell">
          <h4><span id="resultLabel">结果</span> <span class="size" id="compSize"></span></h4>
          <div class="pvwrap"><canvas id="pvComp"></canvas></div>
        </div>
      </div>
      <div class="row" id="resultLinks" style="margin-top:10px"></div>
    </div>
  </div>
</main>

<footer class="statusbar"><span id="status">把图片拖进左侧区域开始,TinyPNG 在线压缩、色彩不变。</span></footer>

<!-- 页内门禁兜底:绕过首页直开本页也需邀请码;与生图/生视频同一把码,验证过则静默直进 -->
<div class="gate-overlay" id="gateOverlay">
  <div class="gate-dialog" role="dialog" aria-modal="true">
    <h2>图片压缩</h2>
    <p class="hint">内部工作台,请输入邀请码进入;一天内错误 3 次将锁定到明天。</p>
    <input type="password" class="gate-input" id="gateCode" autocomplete="off" placeholder="邀请码">
    <button class="btn primary wide" id="gateGo">进入</button>
    <p class="gate-error" id="gateError" hidden></p>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/gate.js"></script>
<script src="js/compress.js"></script>
<script src="js/duoli_video.js"></script>
<script src="js/duoli.js"></script>
</body>
</html>
